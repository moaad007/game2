<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEC Word Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0875ff;
    --blue-soft: #3b9dff;
    --navy: #071326;
    --navy-2: #0c2138;
    --pink: #e43280;
    --ink: #eaf2ff;
    --ink-dim: #9fb4d8;
    --good: #2ecc8f;
    --bad: #ff5d7a;
    --card: rgba(255, 255, 255, 0.055);
    --card-line: rgba(255, 255, 255, 0.12);
    --slot-bg: rgba(255, 255, 255, .045);
    --slot-line: rgba(159, 180, 216, .4);
    --tile-a: rgba(255, 255, 255, .13);
    --tile-b: rgba(255, 255, 255, .06);
    --pool-bg: rgba(255, 255, 255, .035);
    --pool-line: rgba(255, 255, 255, .13);
    --shell-shadow: 0 18px 50px rgba(0, 0, 0, .3);
    --radius: 20px;
  }
  body.light {
    --blue-soft: #0566d8;
    --navy: #ffffff;
    --navy-2: #ffffff;
    --ink: #12253f;
    --ink-dim: #4d6484;
    --good: #0b9d66;
    --card: rgba(18, 48, 84, .055);
    --card-line: rgba(18, 48, 84, .16);
    --slot-bg: rgba(18, 48, 84, .04);
    --slot-line: rgba(77, 100, 132, .55);
    --tile-a: #ffffff;
    --tile-b: #f3f7fd;
    --pool-bg: rgba(18, 48, 84, .045);
    --pool-line: rgba(18, 48, 84, .16);
    --shell-shadow: 0 18px 48px rgba(24, 60, 104, .18);
  }
  body.light::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 12% -8%, #dcebff 0%, transparent 60%),
      radial-gradient(800px 620px at 96% 108%, #ffe3f1 0%, transparent 58%),
      linear-gradient(165deg, #eef4fc, #e2ebf8);
  }
  body.light .orb { display: none; }
  body.light .game-shell { background: #ffffff; }
  body.light .tile { border-color: rgba(18, 48, 84, .18); box-shadow: 0 3px 8px rgba(24, 60, 104, .13); }
  body.light .tile:hover { box-shadow: 0 6px 14px rgba(24, 60, 104, .18); }
  body.light .topic-chip { background: #ffffff; }
  body.light .topic-chip.selected { background: rgba(8, 117, 255, .1); }
  body.light .score-pill { background: rgba(228, 50, 128, .1); border-color: rgba(228, 50, 128, .32); color: #c2255c; }
  body.light .score-pill svg { color: #e43280; }
  body.light .progress-track { background: rgba(18, 48, 84, .1); }
  body.light .icon-btn { background: #ffffff; }
  body.light .result-stars svg { color: #f5a623; }
  body.light .pool::before { background: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* ambient background */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .32; pointer-events: none; z-index: 0; }
  .orb-1 { width: 420px; height: 420px; background: var(--blue); top: -140px; left: -120px; }
  .orb-2 { width: 380px; height: 380px; background: var(--pink); bottom: -150px; right: -110px; opacity: .22; }

  /* full-bleed app: fills the viewport / embedding iframe, edge to edge */
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    padding: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .screen { display: none; animation: fadeUp .35s ease; }
  .screen.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- generic bits ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px;
  }
  .btn {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    font-weight: 800; font-size: 16px; color: #fff;
    background: linear-gradient(180deg, var(--blue-soft), var(--blue));
    border-radius: 999px; padding: 13px 26px;
    box-shadow: 0 6px 18px rgba(8, 117, 255, .35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn.ghost { background: var(--card); border: 1px solid var(--card-line); box-shadow: none; color: var(--ink); }
  .btn.pink { background: linear-gradient(180deg, #f0609b, var(--pink)); box-shadow: 0 6px 18px rgba(228,50,128,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.small { padding: 9px 18px; font-size: 14px; }

  /* ---------- home ---------- */
  .brand { text-align: center; margin: 26px 0 6px; }
  .brand .logo {
    width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 14px;
    background: linear-gradient(160deg, var(--blue), #064bb3);
    color: #fff; /* icon stays white on the blue tile in both themes */
    display: flex; align-items: center; justify-content: center; font-size: 44px;
    box-shadow: 0 14px 34px rgba(8,117,255,.4), inset 0 2px 0 rgba(255,255,255,.28);
  }
  .brand h1 { font-size: 34px; font-weight: 900; letter-spacing: .5px; }
  .brand h1 em { font-style: normal; color: var(--blue-soft); }
  .brand p { color: var(--ink-dim); font-weight: 700; margin-top: 6px; font-size: 15px; }

  .section-label {
    display: flex; align-items: center; gap: 12px; margin: 30px 0 14px;
    color: var(--ink-dim); font-weight: 800; font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase;
  }
  .section-label::before, .section-label::after { content: ""; height: 1px; flex: 1; background: var(--card-line); }

  .topic-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .topic-chip {
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 2px solid var(--card-line); border-radius: 999px;
    padding: 9px 16px 9px 13px; font-family: inherit; font-weight: 800; font-size: 14.5px; color: var(--ink);
    transition: border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .topic-chip svg { width: 18px; height: 18px; color: var(--blue-soft); }
  .topic-chip:hover { transform: translateY(-2px); border-color: rgba(59, 157, 255, .5); }
  .topic-chip.selected { border-color: var(--blue); background: rgba(8, 117, 255, .16); }
  .start-actions { display: flex; justify-content: center; margin-top: 34px; }
  .play-btn { font-size: 22px; letter-spacing: 2px; padding: 17px 70px; animation: playPulse 2.4s ease-in-out infinite; }
  @keyframes playPulse {
    0%, 100% { box-shadow: 0 6px 18px rgba(8, 117, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .25); }
    50% { box-shadow: 0 10px 34px rgba(8, 117, 255, .62), inset 0 1px 0 rgba(255, 255, 255, .25); transform: translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce) { .play-btn { animation: none; } }

  .footnote { text-align: center; color: var(--ink-dim); font-size: 12.5px; font-weight: 700; margin-top: 34px; line-height: 1.6; }

  /* ---------- loading ---------- */
  #screen-loading.active { justify-content: center; align-items: center; }
  .load-emoji { font-size: 64px; display: inline-block; animation: bounce 1s infinite ease-in-out alternate; }
  @keyframes bounce { from { transform: translateY(0) } to { transform: translateY(-18px) } }
  #load-status { margin-top: 22px; font-weight: 800; font-size: 17px; }
  #load-sub { margin-top: 8px; color: var(--ink-dim); font-weight: 700; font-size: 14px; min-height: 20px; }
  .load-bar { width: 220px; height: 8px; background: var(--card); border: 1px solid var(--card-line); border-radius: 99px; margin: 26px auto 0; overflow: hidden; }
  .load-bar i { display: block; height: 100%; width: 30%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--pink)); animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -35% } 100% { margin-left: 100% } }

    /* ---------- game chrome ---------- */
  /* start + loading screens center their content in the full viewport */
  #screen-home.active { justify-content: center; align-items: center; }
  #screen-loading.active { justify-content: center; align-items: center; }
  #screen-loading { text-align: center; }

  /* the game shell IS the page in the embed — no outer margins, no card chrome */
  .game-shell {
    background: var(--card);
    border: none;
    border-radius: 0;
    box-shadow: none;
    padding: clamp(8px, 1.6vmin, 14px) clamp(10px, 1.8vmin, 18px) clamp(10px, 1.8vmin, 18px);
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    width: 100%;
  }
  /* the shell IS the card — flatten the inner cards the renderers draw */
  .game-shell .card { background: transparent; border: none; padding: 0; }
  .game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--card-line); flex: 0 0 auto; }
  #game-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #game-body > .card { width: 100%; }
  #game-body > .card.scramble-stage { flex: 1; display: flex; flex-direction: column; }
  .scramble-stage .slots { margin: auto 0; }
  .scramble-stage .pool { margin-top: auto; }
  .scramble-stage .scramble-actions { margin-top: 14px; flex: 0 0 auto; }
  #game-body > .card.solved-box, #game-body > .results { margin-top: auto; margin-bottom: auto; }
  .icon-btn {
    cursor: pointer; width: 42px; height: 42px; flex: 0 0 42px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--card-line);
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--ink);
    transition: background .15s ease;
  }
  .icon-btn:hover { background: rgba(59,157,255,.14); }
  .progress-track { flex: 1; height: 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--card-line); overflow: hidden; }
  .progress-track i { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--blue-soft)); transition: width .4s ease; }
  .score-pill { background: rgba(228,50,128,.13); border-color: rgba(240,96,155,.4); color: #ff9dc2; }

  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius); padding: 20px; }
  .hint-def { color: var(--ink-dim); font-weight: 700; font-size: 15px; line-height: 1.55; text-align: center; }
  .hint-def b { color: var(--ink); }

  /* ---------- scramble ---------- */
  .scramble-stage { text-align: center; }
  .slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 24px 0; min-height: 62px; }
  .slot {
    width: 52px; height: 62px; border-radius: 14px; cursor: pointer;
    background: var(--slot-bg); border: 2px dashed var(--slot-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 900; text-transform: uppercase; color: var(--blue-soft);
    transition: border-color .15s ease, background .15s ease;
  }
  .slot.filled { border-style: solid; border-color: rgba(59,157,255,.65); background: rgba(8,117,255,.14); cursor: pointer; }
  .slot.locked { border-color: var(--good); background: rgba(46,204,143,.14); color: var(--good); }
  .pool {
    position: relative;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin: 16px 0 20px; padding: 15px 10px 13px; min-height: 88px;
    background: var(--pool-bg);
    border: 2px solid var(--pool-line);
    border-radius: 16px;
    box-shadow: inset 0 3px 10px rgba(0, 0, 0, .28);
  }
  .pool::before {
    content: 'LETTER BOX';
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 9.5px; font-weight: 900; letter-spacing: 2.5px; color: var(--ink-dim);
    background: var(--navy-2); padding: 0 10px; border-radius: 99px;
    border: 1px solid var(--card-line);
  }
  /* round-start rain: tiles fall from above and bounce into the box */
  .tile.falling {
    animation: tileFall 560ms cubic-bezier(.25, .9, .3, 1.05) backwards;
    animation-delay: calc(var(--i, 0) * 60ms);
    pointer-events: none;
  }
  @keyframes tileFall {
    0% { transform: translateY(-48vh) rotate(var(--r, 8deg)) scale(1.04); opacity: 0; }
    55% { opacity: 1; }
    70% { transform: translateY(0) rotate(0deg); }
    84% { transform: translateY(-13px); }
    100% { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile.falling { animation: none; }
  }
  .tile {
    cursor: pointer; width: 52px; height: 62px; border-radius: 14px;
    background: linear-gradient(180deg, var(--tile-a), var(--tile-b));
    border: 1px solid var(--card-line); box-shadow: 0 4px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 900; text-transform: uppercase;
    transition: transform .12s ease, opacity .15s ease;
  }
  .tile:hover { transform: translateY(-3px); }
  .tile.used { opacity: 0; pointer-events: none; transform: scale(.6); }

  /* drag & drop */
  .tile, .slot { touch-action: none; user-select: none; -webkit-user-select: none; }
  .tile { cursor: grab; }
  .slot.filled { cursor: grab; }
  body.scr-dragging, body.scr-dragging * { cursor: grabbing !important; }
  .tile.lifted { opacity: .25; }
  .slot.lifted-slot { opacity: .3; }
  .tile.drag-ghost {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0;
    /* transform is driven by JS: translate(x,y) translate(-50%,-58%) rotate(2.5deg) scale(1.15) */
    box-shadow: 0 18px 38px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .12);
    background: linear-gradient(180deg, #2f66b8, var(--blue));
    border-color: rgba(255, 255, 255, .5);
    will-change: transform;
  }
  .slot.drop-ok { border-color: #bfe3ff; background: rgba(59, 157, 255, .28); transform: scale(1.1); }
  /* gentle pulse on every open slot while a pool tile is being dragged */
  body.scr-dragging-pool .slot:not(.filled):not(.locked) { animation: slotGuide 1.1s ease-in-out infinite; border-color: rgba(59, 157, 255, .5); }
  @keyframes slotGuide { 0%, 100% { background: rgba(255, 255, 255, .03); } 50% { background: rgba(59, 157, 255, .14); } }
  /* the pool lights up while dragging a letter out of a slot */
  .pool.pool-drop-ok {
    background: rgba(59, 157, 255, .09);
    border-radius: 14px;
    box-shadow: inset 0 0 0 1.5px rgba(59, 157, 255, .45);
  }
  /* landing bounce when a letter settles into a slot */
  .slot.pop { animation: slotPop .28s cubic-bezier(.2, .8, .3, 1.4); }
  @keyframes slotPop { 0% { transform: scale(1); } 45% { transform: scale(1.16); background: rgba(8, 117, 255, .32); } 100% { transform: scale(1); } }

  /* scramble hint reveals */
  /* the meaning (3rd) hint stands out in gold */
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 94, .4); }
    50% { box-shadow: 0 0 0 8px rgba(255, 193, 94, 0); }
  }
  #scr-def.meaning {
    margin: 4px auto 14px;
    max-width: 640px;
    padding: 12px 18px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255, 209, 102, .15), rgba(255, 209, 102, .06));
    border: 1.5px solid rgba(255, 209, 102, .5);
    box-shadow: 0 6px 24px rgba(255, 193, 94, .16);
    color: var(--ink);
    font-size: 16.5px;
    animation: meaningPop .45s cubic-bezier(.2, .8, .3, 1.3);
  }
  #scr-def.meaning svg { width: 19px; height: 19px; color: #ffd166; }
  #scr-def.meaning b { color: var(--ink); }
  @keyframes meaningPop {
    0% { transform: scale(.85); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.btn-hint.hot { animation: none; }
    #scr-def.meaning { animation: none; }
  }
  /* prominent action buttons under the letter box */
  .scramble-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .scramble-actions .btn.small { font-size: 15px; padding: 12px 26px; }
  .btn.btn-hint {
    background: linear-gradient(180deg, var(--blue-soft), var(--blue));
    color: #fff;
    box-shadow: 0 6px 18px rgba(8, 117, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .btn.btn-hint:disabled {
    background: var(--card); color: var(--ink-dim);
    box-shadow: none; transform: none; filter: none;
  }
  .btn.btn-hint.hot {
    background: linear-gradient(180deg, #ffd166, #f5a623);
    color: #4a3200;
    border-color: rgba(255, 209, 102, .7);
    box-shadow: 0 6px 22px rgba(255, 193, 94, .45), inset 0 1px 0 rgba(255, 255, 255, .4);
    animation: hintPulse 1.7s ease-in-out infinite;
  }
  .btn.btn-skip {
    background: rgba(228, 50, 128, .13);
    border: 1.5px solid rgba(240, 96, 155, .55);
    color: #ff9dc2;
    box-shadow: none;
  }
  .btn.btn-skip:hover { transform: translateY(-2px); background: rgba(228, 50, 128, .2); }
  body.light .btn.btn-skip { background: rgba(228, 50, 128, .08); color: #c2255c; }
  body.light .btn.btn-skip:hover { background: rgba(228, 50, 128, .14); }

  .solved-box { text-align: center; animation: popIn .35s ease; }
  @keyframes popIn { from { transform: scale(.8); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .solved-word { font-size: 34px; font-weight: 900; color: var(--good); letter-spacing: 3px; text-transform: uppercase; }

  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }

  /* ---------- results ---------- */
  .results {
    text-align: center;
    animation: fadeUp .35s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    width: 100%; max-width: 560px;
    margin: auto; padding: 8px 0 4px;
  }
  .result-stars { margin: 2px 0 0; }
  .result-score { font-size: clamp(34px, 6.4vmin, 52px); line-height: 1.05; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px; margin: 8px 0 0; }
  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .result-stars span { display: inline-block; animation: popIn .4s ease backwards; }
  .result-stars span:nth-child(2) { animation-delay: .18s; }
  .result-stars span:nth-child(3) { animation-delay: .36s; }
  .r-star.off { opacity: .5; }
  .result-score { font-weight: 900; color: var(--blue-soft); }
  .result-label { color: var(--ink-dim); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
  .result-stat { background: var(--card); border: 1px solid var(--card-line); border-radius: 16px; padding: 16px 8px; }
  .result-stat .v { font-size: 26px; font-weight: 900; }
  .result-stat .k { color: var(--ink-dim); font-size: 12.5px; font-weight: 800; margin-top: 3px; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--navy-2); border: 1px solid var(--card-line); color: var(--ink);
    border-radius: 14px; padding: 12px 20px; font-weight: 800; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 50;
    box-shadow: 0 12px 30px rgba(0,0,0,.45); max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- svg icon system ---------- */
  .ic { width: 1.15em; height: 1.15em; flex: 0 0 auto; vertical-align: -0.2em; }
  .brand .logo svg { width: 42px; height: 42px; }
  .topic-chip svg { width: 18px; height: 18px; }
  .load-emoji svg { width: 62px; height: 62px; }
  .result-stars svg { width: 46px; height: 46px; color: #ffd166; }
  .score-pill svg { width: 15px; height: 15px; color: #ffd166; }
  .icon-btn svg { width: 19px; height: 19px; }

  /* success animations */
  .confetti {
    position: fixed; z-index: 90; pointer-events: none; border-radius: 2px;
    animation: confettiFly var(--dur, 900ms) cubic-bezier(.15, .6, .4, 1) forwards;
  }
  @keyframes confettiFly {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 260px)) rotate(var(--rot)); opacity: 0; }
  }
  .float-pts {
    position: fixed; z-index: 91; pointer-events: none;
    transform: translateX(-50%);
    font-weight: 900; font-size: 24px; color: #ffd166;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .45);
    animation: ptsRise 1s ease-out forwards;
  }
  @keyframes ptsRise {
    0% { opacity: 0; translate: 0 8px; }
    25% { opacity: 1; }
    100% { opacity: 0; translate: 0 -48px; }
  }
  .solved-word span {
    display: inline-block;
    animation: letterPop .42s cubic-bezier(.2, .8, .3, 1.4) backwards;
  }
  @keyframes letterPop {
    from { transform: scale(0) rotate(-14deg); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti, .float-pts { display: none; }

/* --- success effects --- */
function confettiBurst(x, y, count = 26) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#0875ff', '#3b9dff', '#e43280', '#ffd166', '#2ecc8f', '#ffffff'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', (Math.random() * 240 - 120).toFixed(0) + 'px');
    p.style.setProperty('--dy', (-40 - Math.random() * 170).toFixed(0) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
    p.style.setProperty('--dur', (650 + Math.random() * 550).toFixed(0) + 'ms');
    const s = 6 + Math.random() * 6;
    p.style.width = s + 'px';
    p.style.height = (s * 0.6).toFixed(1) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1350);
  }
}
function floatPoints(text, x, y) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = document.createElement('div');
  el.className = 'float-pts';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}

  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ---------------- sound (tiny synth, no assets) ---------------- */
const Sound = {
  ctx: null,
  muted: localStorage.getItem('wordlab.muted') === '1',
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  tone(freq, dur, type = 'sine', vol = 0.14, when = 0) {
    if (this.muted) return;
    this.ensure();
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  correct() { this.tone(523, .12, 'sine', .16); this.tone(784, .18, 'sine', .16, .1); },
  wrong() { this.tone(196, .2, 'sawtooth', .07); },
  tap() { this.tone(340, .05, 'sine', .06); },
  drop() { this.tone(125 + Math.random() * 45, .07, 'sine', .09); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .16, 'sine', .15, i * .12)); },
};

/* ================================================================
   DATA HUB — seeds + Datamuse + Wikimedia, cached in localStorage
   ================================================================ */
const DataHub = {
  cacheKey(cat) { return 'wordlab.v7.' + cat; },

  readCache(cat) {
    try {
      const raw = localStorage.getItem(this.cacheKey(cat));
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (Date.now() - data.ts > CACHE_TTL) return null;
      if (!Array.isArray(data.items) || data.items.length < SESSION_WORDS) return null;
      return data.items;
    } catch (e) { return null; }
  },

  writeCache(cat, items) {
    try { localStorage.setItem(this.cacheKey(cat), JSON.stringify({ ts: Date.now(), items })); } catch (e) {}
  },

  fetchJSON(url, timeoutMs = 7000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(url, { signal: ctrl.signal })
      .then((r) => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .finally(() => clearTimeout(timer));
  },

  /* Turn one Datamuse entry into {w, d} with a kid-friendly definition, or null. */
  cleanEntry(entry) {
    if (!entry || !entry.word || !Array.isArray(entry.defs) || !entry.defs.length) return null;
    const w = entry.word.toLowerCase();
    if (!/^[a-z]{4,9}$/.test(w) || BLOCKED.has(w)) return null;

    // frequency guard: skip very rare words (tags contain "f:xx.x")
    const fTag = (entry.tags || []).find((t) => t.startsWith('f:'));
    if (fTag && parseFloat(fTag.slice(2)) < 0.8) return null;

    let best = null;
    for (const raw of entry.defs) {
      let d = raw.replace(/^[a-z]+\t/, '');          // strip part-of-speech
      d = d.replace(/\([^()]*\)/g, ' ');              // strip (qualifiers)
      d = d.replace(/\s+/g, ' ').replace(/\s([.,;])/g, '$1').trim();
      d = d.replace(/[;\[].*$/, '').trim();           // cut at ; or [
      if (!d) continue;
      d = d.endsWith('.') ? d : d + '.';
      const low = d.toLowerCase();
      if (BAD_DEF_STARTS.some((b) => low.startsWith(b))) continue;
      const len = d.length;
      if (len < 20 || len > 130) continue;
      if (!best || len < best.d.length) best = { w, d };
    }
    return best;
  },

  async fetchApiWords(cat, onStatus) {
    const cfg = CATEGORIES[cat];
    const url = `https://api.datamuse.com/words?${cfg.api}&md=df&max=100`;
    let data;
    try {
      data = await this.fetchJSON(url);
    } catch (e) {
      return { words: [], offline: true };
    }
    const words = (Array.isArray(data) ? data : [])
      .map((x) => this.cleanEntry(x))
      .filter(Boolean);
    return { words, offline: false };
  },

  /* Main entry: get a session-ready word list for a category. */
  async loadCategory(cat, { forceRefresh = false } = {}, onStatus = () => {}) {
    if (!forceRefresh) {
      const cached = this.readCache(cat);
      if (cached) return { items: shuffle(cached), fromCache: true, offline: false };
    }

    // "all" mixes every topic: 2 seeds per category + a few live words from each
    if (cat === 'all') {
      const cats = Object.keys(CATEGORIES);
      const seedPool = [];
      const seen = new Set();
      for (const c of cats) {
        for (const [w, d] of shuffle(SEEDS[c]).slice(0, 3)) {
          if (!seen.has(w)) { seen.add(w); seedPool.push({ w, d }); }
        }
      }
      onStatus('Asking the word robots for fresh words…');
      const results = await Promise.all(cats.map((c) => this.fetchApiWords(c).catch(() => ({ words: [], offline: true }))));
      const apiPool = [];
      let offline = true;
      results.forEach((r, i) => {
        if (!r.offline) offline = false;
        const catSeeds = new Set(SEEDS[cats[i]].map(([w]) => w));
        r.words.filter((x) => !catSeeds.has(x.w) && !seen.has(x.w)).slice(0, 3)
          .forEach((x) => { seen.add(x.w); apiPool.push({ w: x.w, d: x.d }); });
      });
      const items = shuffle([...shuffle(seedPool).slice(0, 12), ...shuffle(apiPool).slice(0, SESSION_WORDS - 12)]);
      // top up from the remaining seed pool if the API was unreachable
      if (items.length < SESSION_WORDS) {
        const rest = seedPool.filter((s) => !items.some((i) => i.w === s.w));
        items.push(...shuffle(rest).slice(0, SESSION_WORDS - items.length));
      }
      this.writeCache(cat, items);
      return { items, fromCache: false, offline };
    }

    const seedItems = shuffle(SEEDS[cat]).map(([w, d]) => ({ w, d }));
    onStatus('Asking the word robots for fresh words…');

    const { words: apiWords, offline } = await this.fetchApiWords(cat);
    const seedSet = new Set(seedItems.map((s) => s.w));
    // keep Datamuse relevance order (best first), then cap the pool before shuffling
    const extras = apiWords.filter((x) => !seedSet.has(x.w)).slice(0, 15).map((x) => ({ w: x.w, d: x.d }));

    // mix: 10 curated seeds (quality) + up to 6 fresh API words; top up from seeds when offline
    const picks = [...seedItems.slice(0, 10), ...shuffle(extras).slice(0, SESSION_WORDS - 10)];
    if (picks.length < SESSION_WORDS) picks.push(...seedItems.slice(10, 10 + (SESSION_WORDS - picks.length)));
    const items = shuffle(picks);

    this.writeCache(cat, items);
    return { items, fromCache: false, offline };
  },
};

/* ================================================================
   GAME — pure Word Scramble: 12 rounds, drag & drop letter tiles, hints, skip
   ================================================================ */
const Game = {
  cat: null,
  items: [],
  plan: [],
  round: 0,       // 0-based round index
  rounds: 12,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correct: 0,
  answered: 0,
  locked: false,

  start(cat, items) {
    this.cat = cat; this.items = items;
    this.round = 0; this.score = 0; this.streak = 0; this.bestStreak = 0;
    this.correct = 0; this.answered = 0; this.locked = false;
    this.rounds = Math.min(12, items.length);

    $('game-score').textContent = '0';
    showScreen('screen-game');
    this.renderRound();
  },

  addPoints(n) {
    this.score = Math.max(0, this.score + n);
    $('game-score').textContent = this.score;
  },

  markAnswer(wasCorrect) {
    this.answered++;
    if (wasCorrect) {
      this.correct++;
      this.streak++;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
    } else {
      this.streak = 0;
    }
  },

  updateProgress() {
    const pct = Math.round(((this.round + 1) / this.rounds) * 100);
    $('game-progress').style.width = Math.min(100, Math.max(4, pct)) + '%';
  },

  renderRound() {
    this.locked = false;
    this.updateProgress();
    this.renderScramble($('game-body'), this.items[this.round]);
  },

  nextRound() {
    this.round++;
    if (this.round >= this.rounds) this.finish();
    else this.renderRound();
  },

  finish() {
    this.locked = true;
    $('game-progress').style.width = '100%';
    const acc = this.answered ? Math.round((this.correct / this.answered) * 100) : 0;
    let stars = acc >= 90 ? 3 : acc >= 65 ? 2 : acc >= 40 ? 1 : 0;
    const titles = ['Keep practicing!', 'Nice work!', 'Great job!', 'Word champion!'];

    // results render INSIDE the game shell, header stays on top
    $('game-body').innerHTML = `
      <div class="results">
        <div class="result-label">${titles[stars]}</div>
        <div class="result-stars">
          ${`<span class="r-star">${icon('star')}</span>`.repeat(stars)}${`<span class="r-star off">${icon('starO')}</span>`.repeat(3 - stars)}
        </div>
        <div class="result-score">${this.score}</div>
        <div class="result-label">points</div>
        <div class="result-grid">
          <div class="result-stat"><div class="v">${acc}%</div><div class="k">Accuracy</div></div>
          <div class="result-stat"><div class="v">${this.bestStreak}</div><div class="k">Best streak</div></div>
        </div>
        <div class="result-actions">
          <button class="btn" id="btn-again"></button>
          <button class="btn ghost" id="btn-renew"></button>
          <button class="btn pink" id="btn-new-topic"></button>
        </div>
      </div>`;
    $('btn-again').innerHTML = icon('refresh') + '<span>Play again</span>';
    $('btn-renew').innerHTML = icon('shuffle') + '<span>New words</span>';
    $('btn-new-topic').innerHTML = icon('compass') + '<span>Change topic</span>';
    $('btn-again').addEventListener('click', () => Game.start(Game.cat, shuffle(Game.items)));
    $('btn-renew').addEventListener('click', () => startCategory(Game.cat, true));
    $('btn-new-topic').addEventListener('click', () => { buildTopicChips(); showScreen('screen-home'); });
    Sound.win();
    // celebrate good results
    if (stars >= 2) {
      confettiBurst(innerWidth * 0.32, innerHeight * 0.38, 30);
      setTimeout(() => confettiBurst(innerWidth * 0.68, innerHeight * 0.38, 30), 260);
    }
    if (stars === 3) setTimeout(() => confettiBurst(innerWidth * 0.5, innerHeight * 0.32, 38), 560);
  },

  /* ---------------- SCRAMBLE ---------------- */
  renderScramble(body, item) {
    const word = item.w;
    let letters = shuffle(word.split(''));
    if (word.length > 1) {
      let tries = 0;
      while (letters.join('') === word && tries++ < 20) letters = shuffle(letters);
    }
    const lockedIn = []; // indices of pool tiles pinned by hints
    const HINTS = [
      { label: 'Hint: letter (−3)', cost: 3 },
      { label: 'Hint: letter (−3)', cost: 3 },
      { label: 'Hint: meaning (−2)', cost: 2 },
    ];
    let hintLevel = 0;
    const setHintBtn = (label, disabled, isMeaning) => {
      const b = $('scr-hint');
      b.innerHTML = icon(isMeaning && !disabled ? 'book' : 'bulb') + '<span>' + label + '</span>';
      b.disabled = !!disabled;
      b.classList.toggle('hot', !!isMeaning && !disabled);
    };

    body.innerHTML = `
      <div class="card scramble-stage">
        <p class="hint-def">${icon('shuffle')} Mystery word ${this.round + 1}/${this.rounds} — need a hint?</p>
        <p class="hint-def" id="scr-def" hidden></p>
        <div class="slots" id="scr-slots"></div>
        <div class="pool" id="scr-pool"></div>
        <div class="scramble-actions">
          <button class="btn small btn-hint" id="scr-hint"></button>
          <button class="btn ghost small btn-skip" id="scr-skip">${icon('arrowR')}<span>Skip</span></button>
        </div>
      </div>`;

    const slotsEl = $('scr-slots');
    const poolEl = $('scr-pool');
    const state = { chosen: Array.from({ length: word.length }, () => null) }; // pool tile indexes currently in slots
    let justDragged = false;

    const setSlotVisual = (i) => {
      const slot = slotsEl.children[i];
      const p = state.chosen[i];
      if (p == null) { slot.textContent = ''; slot.classList.remove('filled'); }
      else { slot.textContent = poolEl.children[p].textContent; slot.classList.add('filled'); }
    };
    const maybeCheck = () => {
      if (state.chosen.every((x) => x != null)) this.checkScramble(state, item, slotsEl, lockedIn);
    };
    const tapOk = () => (justDragged ? ((justDragged = false), false) : true);

    for (let i = 0; i < word.length; i++) {
      const s = document.createElement('div');
      s.className = 'slot'; s.dataset.i = i;
      s.addEventListener('click', () => {
        if (!tapOk() || this.locked || lockedIn.includes(i) || state.chosen[i] == null) return;
        poolEl.children[state.chosen[i]].classList.remove('used');
        state.chosen[i] = null;
        setSlotVisual(i);
        Sound.tap();
      });
      slotsEl.appendChild(s);
    }
    letters.forEach((ch, idx) => {
      const t = document.createElement('div');
      t.className = 'tile falling'; t.textContent = ch; t.dataset.idx = idx;
      t.style.setProperty('--i', idx);
      t.style.setProperty('--r', (Math.random() * 26 - 13).toFixed(1) + 'deg');
      // animationend is unreliable (occluded panes freeze CSS animations;
      // prefers-reduced-motion disables them) — always clear via timer as well
      const finishFall = () => t.classList.remove('falling');
      t.addEventListener('animationend', finishFall, { once: true });
      setTimeout(finishFall, 120 + 560 + idx * 60 + 80);
      // soft thud when this tile lands in the box
      setTimeout(() => Sound.drop(), 120 + 560 * 0.7 + idx * 60);
      t.addEventListener('click', () => {
        if (!tapOk() || this.locked || t.classList.contains('used')) return;
        const slotIdx = state.chosen.findIndex((x) => x == null);
        if (slotIdx === -1) return;
        state.chosen[slotIdx] = idx;
        t.classList.add('used');
        setSlotVisual(slotIdx);
        Sound.tap();
        maybeCheck();
      });
      poolEl.appendChild(t);
    });

    /* ---- drag & drop (pointer events; taps still work) ---- */
    let tracking = false;
    const THRESH = 6;
    const makeGhost = (text) => {
      const g = document.createElement('div');
      g.className = 'tile drag-ghost';
      g.textContent = text;
      document.body.appendChild(g);
      return g;
    };
    const placeGhost = (g, x, y) => {
      g.style.transform = `translate(${x}px, ${y}px) translate(-50%, -58%) rotate(2.5deg) scale(1.15)`;
    };
    // animate the ghost into a target rect, then commit
    const flyGhost = (g, rect, done) => {
      g.style.transition = 'transform 150ms cubic-bezier(.2,.8,.3,1.2), opacity 150ms ease';
      g.style.transform = `translate(${rect.x + rect.width / 2}px, ${rect.y + rect.height / 2}px) translate(-50%, -50%) rotate(0deg) scale(1)`;
      setTimeout(() => { g.remove(); done && done(); }, 160);
    };
    const slotPop = (i) => {
      const el = slotsEl.children[i];
      el.classList.remove('pop'); void el.offsetWidth;
      el.classList.add('pop');
    };
    const clearDropMarks = () => {
      slotsEl.querySelectorAll('.drop-ok').forEach((x) => x.classList.remove('drop-ok'));
      poolEl.classList.remove('pool-drop-ok');
    };
    const slotAtPoint = (x, y) => {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest('.slot') : null;
    };
    const beginTrack = (e, onStart) => {
      if (tracking) return;
      tracking = true;
      const sx = e.clientX, sy = e.clientY;
      let ctx = null;
      const move = (ev) => {
        if (!ctx && Math.hypot(ev.clientX - sx, ev.clientY - sy) > THRESH) {
          ctx = onStart(ev);
          document.body.classList.add('scr-dragging', ctx.fromPool ? 'scr-dragging-pool' : 'scr-dragging-slot');
        }
        if (ctx) {
          placeGhost(ctx.ghost, ev.clientX, ev.clientY);
          clearDropMarks();
          const slot = slotAtPoint(ev.clientX, ev.clientY);
          if (slot && !slot.classList.contains('locked') && ctx.acceptsSlot(slot)) slot.classList.add('drop-ok');
          if (!ctx.fromPool) poolEl.classList.add('pool-drop-ok');
        }
      };
      const finish = (ev, commit) => {
        window.removeEventListener('pointermove', move);
        tracking = false;
        if (!ctx) return; // plain tap — let the click handler do its job
        document.body.classList.remove('scr-dragging', 'scr-dragging-pool', 'scr-dragging-slot');
        clearDropMarks();
        justDragged = true;
        setTimeout(() => (justDragged = false), 0);
        const slot = commit && ev ? slotAtPoint(ev.clientX, ev.clientY) : null;
        if (slot && !slot.classList.contains('locked') && ctx.acceptsSlot(slot)) {
          flyGhost(ctx.ghost, slot.getBoundingClientRect(), () => ctx.drop(slot));
        } else if (!slot && commit && ctx.toPool) {
          flyGhost(ctx.ghost, poolEl.getBoundingClientRect(), ctx.toPool);
        } else {
          flyGhost(ctx.ghost, ctx.homeRect(), ctx.restore); // snap back home
        }
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', (ev) => finish(ev, true), { once: true });
      window.addEventListener('pointercancel', () => finish(null, false), { once: true });
    };

    // draggable pool tiles
    [...poolEl.children].forEach((t, idx) => {
      t.addEventListener('pointerdown', (e) => {
        if (e.button > 0 || this.locked || t.classList.contains('used')) return;
        beginTrack(e, () => {
          t.classList.add('lifted');
          return {
            fromPool: true,
            ghost: makeGhost(t.textContent),
            acceptsSlot: () => true,
            drop: (slot) => {
              t.classList.remove('lifted');
              const si = parseInt(slot.dataset.i, 10);
              const cur = state.chosen[si];
              if (cur != null) poolEl.children[cur].classList.remove('used'); // kick out occupant
              state.chosen[si] = idx;
              t.classList.add('used');
              setSlotVisual(si);
              slotPop(si);
              Sound.tap();
              maybeCheck();
            },
            toPool: null,
            homeRect: () => t.getBoundingClientRect(),
            restore: () => t.classList.remove('lifted'),
          };
        });
      });
    });

    // draggable filled slots (move / swap / drag back to pool)
    [...slotsEl.children].forEach((s, i) => {
      s.addEventListener('pointerdown', (e) => {
        if (e.button > 0 || this.locked || lockedIn.includes(i) || state.chosen[i] == null) return;
        beginTrack(e, () => {
          s.classList.add('lifted-slot');
          return {
            fromPool: false,
            ghost: makeGhost(s.textContent),
            acceptsSlot: (slot) => slot !== s,
            drop: (slot) => {
              s.classList.remove('lifted-slot');
              const ti = parseInt(slot.dataset.i, 10);
              const a = state.chosen[i], b = state.chosen[ti];
              state.chosen[ti] = a; state.chosen[i] = b; // move, or swap if occupied
              setSlotVisual(i); setSlotVisual(ti);
              slotPop(ti);
              if (b != null) slotPop(i);
              Sound.tap();
              maybeCheck();
            },
            toPool: () => { // released outside the slots → return the letter to the pool
              s.classList.remove('lifted-slot');
              poolEl.children[state.chosen[i]].classList.remove('used');
              state.chosen[i] = null;
              setSlotVisual(i);
              Sound.tap();
            },
            homeRect: () => s.getBoundingClientRect(),
            restore: () => s.classList.remove('lifted-slot'),
          };
        });
      });
    });

    $('scr-skip').addEventListener('click', () => {
      if (this.locked) return;
      this.markAnswer(false);
      this.revealScramble(item, true);
    });

    $('scr-hint').addEventListener('click', () => {
      if (this.locked || hintLevel >= 3) return;
      if (hintLevel <= 1) {
        // lock one correct letter into the first empty-or-wrong slot
        let target = -1;
        for (let i = 0; i < word.length; i++) {
          if (lockedIn.includes(i)) continue;
          const cur = state.chosen[i];
          if (cur == null || poolEl.children[cur].textContent !== word[i]) { target = i; break; }
        }
        if (target === -1) return;
        const cur = state.chosen[target];
        if (cur != null) poolEl.children[cur].classList.remove('used');
        const poolIdx = [...poolEl.children].findIndex((x) => !x.classList.contains('used') && x.textContent === word[target]);
        if (poolIdx === -1) return;
        state.chosen[target] = poolIdx;
        poolEl.children[poolIdx].classList.add('used');
        const slot = slotsEl.children[target];
        slot.textContent = word[target];
        slot.classList.add('filled', 'locked');
        lockedIn.push(target);
        Sound.tap();
        maybeCheck();
      } else {
        $('scr-def').innerHTML = icon('book') + ' <b>' + esc(item.d) + '</b>';
        $('scr-def').hidden = false;
        $('scr-def').classList.add('meaning');
      }
      this.addPoints(-HINTS[hintLevel].cost);
      hintLevel++;
      setHintBtn(hintLevel >= 3 ? 'No more hints' : HINTS[hintLevel].label, hintLevel >= 3, hintLevel === 2);
    });
    setHintBtn(HINTS[0].label, false);
  },

  checkScramble(state, item, slotsEl, lockedIn) {
    const word = item.w;
    const guess = [...slotsEl.children].map((s) => s.textContent).join('');
    if (guess === word) {
      this.markAnswer(true);
      const award = 10 + Math.min(this.streak - 1, 4) * 2;
      this.addPoints(award);
      Sound.correct();
      // celebrate: burst over the slots + floating points
      const r = slotsEl.getBoundingClientRect();
      confettiBurst(r.x + r.width / 2, r.y + r.height / 2);
      floatPoints('+' + award, r.x + r.width / 2, r.y - 6);
      this.revealScramble(item, false);
    } else {
      Sound.wrong();
      slotsEl.classList.add('shake');
      setTimeout(() => slotsEl.classList.remove('shake'), 450);
      // return non-locked letters to the pool so the player can fix them
      setTimeout(() => {
        [...slotsEl.children].forEach((slot, i) => {
          if (lockedIn.includes(i)) return;
          const cur = state.chosen[i];
          if (cur != null) poolOf(slotsEl).children[cur].classList.remove('used');
          state.chosen[i] = null;
          slot.textContent = '';
          slot.classList.remove('filled');
        });
      }, 420);
      function poolOf() { return document.getElementById('scr-pool'); }
    }
  },

  revealScramble(item, skipped) {
    this.locked = true;
    const body = $('game-body');
    const nextLabel = this.round + 1 >= this.rounds ? 'See results' : 'Next word';
    body.innerHTML = `
      <div class="card solved-box">
        <p class="hint-def">${skipped ? 'The word was:' : icon('check') + ' You got it!'}</p>
        <div class="solved-word">${[...item.w].map((ch, i) => `<span style="animation-delay:${i * 60}ms">${ch}</span>`).join('')}</div>
        <p class="hint-def">${esc(item.d)}</p>
        <div class="scramble-actions" style="margin-top:18px">
          <button class="btn" id="scr-next">${icon('arrowR')}<span>${nextLabel}</span></button>
        </div>
      </div>`;
    $('scr-next').addEventListener('click', () => this.nextRound());
  },

};

/* ================================================================
   UI WIRING
   ================================================================ */
let selectedTopic = (() => {
  try {
    const saved = localStorage.getItem('wordlab.topic');
    if (saved && (saved === 'all' || CATEGORIES[saved])) return saved;
  } catch (e) {}
  return 'all'; // "All" is the recommended first choice
})();
try { localStorage.setItem('wordlab.topic', selectedTopic); } catch (e) {}

function buildTopicChips() {
  const wrap = $('topic-chips');
  wrap.innerHTML = '';
  const topics = [{ key: 'all', name: 'All' }, ...Object.entries(CATEGORIES).map(([key, cfg]) => ({ key, name: cfg.name }))];
  topics.forEach(({ key, name }) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'topic-chip' + (key === selectedTopic ? ' selected' : '');
    chip.innerHTML = icon(topicMeta(key).icon) + '<span>' + name + '</span>';
    chip.addEventListener('click', () => {
      if (selectedTopic === key) return;
      selectedTopic = key;
      try { localStorage.setItem('wordlab.topic', key); } catch (e) {}
      Sound.tap();
      buildTopicChips();
      prefetchTopic(key); // warm the cache while the player aims at PLAY
    });
    wrap.appendChild(chip);
  });
}

/* silently warm a topic's word cache in the background */
function prefetchTopic(cat) {
  if (DataHub.readCache(cat)) return;
  DataHub.loadCategory(cat).catch(() => {});
}

/* --- static icon injection (chrome buttons, logo) --- */
$('brand-logo').innerHTML = icon('flask');
$('btn-play').innerHTML = icon('play') + '<span>PLAY</span>';
$('btn-game-back').innerHTML = icon('arrowL');
$('score-pill').insertAdjacentHTML('afterbegin', icon('star'));

/* --- theme: fully automatic — always follows the system, no manual controls --- */
const Theme = {
  mq: window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null,
  light: false,
  apply() {
    this.light = this.mq ? this.mq.matches : false;
    document.body.classList.toggle('light', this.light);
  },
};
if (Theme.mq) {
  const onSystemChange = () => Theme.apply();
  if (Theme.mq.addEventListener) Theme.mq.addEventListener('change', onSystemChange);
  else if (Theme.mq.addListener) Theme.mq.addListener(onSystemChange); // old Safari
}
Theme.apply();

let currentLoadToken = 0;
async function startCategory(cat, forceRefresh = false) {
  const token = ++currentLoadToken;
  const meta = topicMeta(cat);
  const cached = !!DataHub.readCache(cat);
  $('load-emoji').innerHTML = icon(meta.icon);
  $('load-status').textContent = cached ? 'Get ready…' : 'Collecting your words…';
  $('load-sub').textContent = meta.name;
  showScreen('screen-loading');
  const started = Date.now();

  let result;
  try {
    result = await DataHub.loadCategory(cat, { forceRefresh }, (s) => {
      if (token === currentLoadToken && !cached) $('load-status').textContent = s;
    });
  } catch (e) {
    result = { items: shuffle(SEEDS[cat]).map(([w, d]) => ({ w, d })), offline: true };
  }

  if (token !== currentLoadToken) return; // user navigated away meanwhile
  await sleep(Math.max(0, cached ? 450 : 600 - (Date.now() - started))); // let the loader breathe

  if (result.offline) toast('Could not reach the word robots — using built-in words');
  Sound.ensure();
  Game.start(cat, result.items);
}

/* --- start screen --- */
buildTopicChips();
$('btn-play').addEventListener('click', () => startCategory(selectedTopic));
prefetchTopic(selectedTopic);

/* --- game chrome --- */
$('btn-game-back').addEventListener('click', () => {
  currentLoadToken++;
  buildTopicChips();
  showScreen('screen-home');
});
const muteBtn = $('btn-mute');
function renderMute() { muteBtn.innerHTML = icon(Sound.muted ? 'volumeX' : 'volume'); }
muteBtn.addEventListener('click', () => {
  Sound.muted = !Sound.muted;
  try { localStorage.setItem('wordlab.muted', Sound.muted ? '1' : '0'); } catch (e) {}
  renderMute();
});
renderMute();
</script>
